<meta name="theme-color" content="#4caf50" />
{{ if eq .Kind "404" }}
<meta name="robots" content="noindex" />
{{ else }}
<link rel="canonical" href="{{ .Permalink }}" />
{{ end }}
<link rel="stylesheet" href="{{ "css/custom.css" | relURL }}" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.css" />

{{/* Publish the original asset used by Hugo's social preview templates. */}}
{{ with resources.Get "img/TitelImage.jpg" }}
<meta property="og:image:width" content="{{ .Width }}" />
<meta property="og:image:height" content="{{ .Height }}" />
<meta property="og:image:alt" content="Körbe und Flechtarbeiten aus Weiden von Claus-Dieter Hauck" />
<meta name="twitter:image:alt" content="Körbe und Flechtarbeiten aus Weiden von Claus-Dieter Hauck" />
<link rel="image_src" href="{{ .Permalink }}" />
{{ end }}
